name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OPENIMC_DISABLE_GPU: "1"
      OPENIMC_DISABLE_LLM: "1"
      OPENIMC_DISABLE_ILASTIK: "1"
      CUDA_VISIBLE_DEVICES: ""
      TORCH_USE_CUDA_DSA: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure headless Qt on Linux
        if: runner.os == 'Linux'
        run: |
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
          echo "QT_QUICK_BACKEND=software" >> "$GITHUB_ENV"
      - name: Normalize Qt scaling on macOS
        if: runner.os == 'macOS'
        run: |
          echo "QT_AUTO_SCREEN_SCALE_FACTOR=0" >> "$GITHUB_ENV"
          echo "QT_SCALE_FACTOR=1" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run fast tests
        run: |
          pytest -m "not slow"
      - name: Run integration tests
        run: |
          pytest -m "integration"
      - name: Run regression tests
        run: |
          pytest -m "regression"
